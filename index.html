<button class="btn b12" onclick="copy(this)">Button 12</button>
<button class="btn b13" onclick="copy(this)">Button 13</button>
<button class="btn b14" onclick="copy(this)">Button 14</button>

<section>
<h1 class="heading">Gradient Border</h1>
<div class="wrap">

<button class="gbtn g3" onclick="copy(this)">Glow Edge</button>

</div>
</section>

<section>
<h1 class="heading">Cyberpunk Neon</h1>
<div class="cyber">
<button class="cbtn c1" onclick="copy(this)">Neon</button>
<button class="cbtn c2" onclick="copy(this)">Pulse</button>
<button class="cbtn c3" onclick="copy(this)">Scan</button>
<button class="cbtn c4" onclick="copy(this)">Glitch</button>
</div>
</section>

<section>
<h1 class="heading">SaaS Buttons</h1>
<div class="saas">
<button class="sbtn s1" onclick="copy(this)">Primary</button>
<button class="sbtn s2" onclick="copy(this)">Secondary</button>
<button class="sbtn s3" onclick="copy(this)">Success</button>
<button class="sbtn s4" onclick="copy(this)">Danger</button>
</div>
</section>
